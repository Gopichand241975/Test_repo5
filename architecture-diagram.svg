<svg width="680" height="540" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg">
<title>Workbench architecture diagram</title>
<desc>Browser sends requests to a Next.js app on Vercel, which uses Next.js API routes to query an Aurora PostgreSQL database over a pooled, SSL connection. Session cookies handle auth.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1C1B19" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="680" height="540" fill="#F7F4EE"/>

<!-- Browser -->
<g>
<rect x="240" y="30" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="50" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Browser</text>
<text x="340" y="68" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">User signs in, views projects</text>
</g>

<line x1="340" y1="86" x2="340" y2="120" stroke="#1C1B19" stroke-width="1" marker-end="url(#arrow)"/>
<text x="360" y="106" font-family="sans-serif" font-size="12" fill="#5F5E5A">HTTPS</text>

<!-- Vercel outer container -->
<g>
<rect x="60" y="120" width="560" height="220" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="80" y="148" font-family="sans-serif" font-size="14" font-weight="600" fill="#0C447C">Vercel</text>
<text x="80" y="166" font-family="sans-serif" font-size="12" fill="#185FA5">Next.js app (App Router)</text>
</g>

<!-- Frontend pages -->
<g>
<rect x="90" y="190" width="220" height="120" rx="12" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="200" y="216" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#085041">Pages</text>
<text x="200" y="234" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">Dashboard, project detail</text>
<text x="200" y="250" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">Login, signup forms</text>
<text x="200" y="266" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">Server-rendered with session</text>
</g>

<!-- API routes -->
<g>
<rect x="350" y="190" width="240" height="120" rx="12" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
<text x="470" y="216" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">API routes</text>
<text x="470" y="234" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">/api/auth, /api/projects</text>
<text x="470" y="250" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">/api/materials</text>
<text x="470" y="266" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">Session cookie auth (JWT)</text>
</g>

<line x1="310" y1="250" x2="348" y2="250" stroke="#1C1B19" stroke-width="1" marker-end="url(#arrow)"/>

<line x1="340" y1="340" x2="340" y2="380" stroke="#1C1B19" stroke-width="1" marker-end="url(#arrow)"/>
<text x="358" y="364" font-family="sans-serif" font-size="12" fill="#5F5E5A">SSL / pooled</text>

<!-- AWS outer container -->
<g>
<rect x="140" y="380" width="400" height="120" rx="20" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="160" y="408" font-family="sans-serif" font-size="14" font-weight="600" fill="#633806">AWS</text>
</g>

<!-- Aurora -->
<g>
<rect x="180" y="420" width="320" height="60" rx="12" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="442" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#26215C">Aurora PostgreSQL</text>
<text x="340" y="460" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">users, projects, materials</text>
</g>

</svg>
